# SM-Elite behind the node's Apache HTTPS site: https://<node>/sm-elite/
# Installed by the sm-elite package as /etc/apache2/conf-available/sm-elite.conf.
# On the ASL3 appliance the port-80 site already redirects to HTTPS, and a
# Let's Encrypt certificate added through asl-web-ui covers this path too.
RedirectMatch 301 ^/sm-elite$ /sm-elite/
<Location /sm-elite/>
    ProxyPreserveHost On
    RequestHeader set X-Forwarded-Proto expr=%{REQUEST_SCHEME}
    ProxyPass http://127.0.0.1:@PORT@/ upgrade=websocket
    ProxyPassReverse http://127.0.0.1:@PORT@/
    Header always set X-Content-Type-Options "nosniff"
    Header always set Referrer-Policy "same-origin"
    Header always set X-Frame-Options "SAMEORIGIN"
</Location>
