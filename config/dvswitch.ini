; DVSwitch talkgroups for SM-Elite.
;
; Each [node N] is an AllStar node that has a DVSwitch bridge (Analog_Bridge +
; MMDVM_Bridge) hanging off it. The DVSwitch button shows for those nodes.
;   abinfo        the bridge's status file, e.g. /tmp/ABInfo_34001.json
;                 (auto = the newest /tmp/ABInfo_*.json, fine with one bridge)
;   dvswitch_ini  where MMDVM_Bridge's DVSwitch.ini lives (mode ports)
;   modes         optional: only offer these modes on this node
;
; [network NAME] holds a hotspot login. It stays on the server; the browser only
; sees talkgroup names. Use it in a talkgroup as  @NAME <talkgroup>.
;   format        optional, default {password}@{server}:{port}!{tg}
;
; [mode X] lists talkgroups as  name = target. X is DMR, YSF, P25, NXDN, DSTAR,
; ASL, or STFU. Put targets with leading spaces in double quotes.
;
; In demo mode the talkgroups below are attached to demo node 1999.

; [node 1999]
; abinfo = /tmp/ABInfo_34001.json
; dvswitch_ini = /opt/MMDVM_Bridge/DVSwitch.ini
; modes = DMR, YSF

[network brandmeister]
label = BrandMeister
password = your-hotspot-password
server = 3102.master.brandmeister.network
port = 62031

[network tgif]
label = TGIF
password = your-tgif-security-key
server = tgif.network
port = 62031

[mode DMR]
BM Worldwide = @brandmeister 91
BM North America = @brandmeister 93
BM USA = @brandmeister 3100
BM Texas = @brandmeister 3148
BM Parrot = @brandmeister 9990#
BM Disconnect = @brandmeister 4000
TGIF Worldwide = @tgif 0
TGIF Disconnect = @tgif 4000

[mode YSF]
Parrot = register.ysfreflector.de:42020
America Link = americalink.hamfm.com:42000

[mode P25]
Parrot = 10
Worldwide = 10100
Disconnect = 9999

[mode DSTAR]
Echo test = REF001EL
REF001 C = REF001CL
Unlink = "       U"
