; Node stanzas use the Allmon3 / supermon-ng keys.
; `pass` and `passwd` are both accepted. A stanza with nodes= and no host
; is a menu group. multinodes= shares this AMI login with more node numbers.
;
; [1998]
; host = 127.0.0.1
; port = 5038
; user = admin
; pass = change-me
; menu = yes
; system = Nodes
; pollinterval = 1
; voters =
; multinodes =
;
; [Hubs]
; system = Groups
; nodes = 1998,1999
