name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  test-bookworm:
    runs-on: ubuntu-latest
    container: debian:bookworm
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Python dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends python3 python3-aiohttp python3-yaml

      - name: Run tests on Python 3.11
        run: PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s tests

  release:
    needs: test-bookworm
    runs-on: ubuntu-latest
    container: debian:trixie
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install build dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential debhelper dpkg-dev python3 python3-aiohttp python3-yaml

      - name: Verify tag matches debian/changelog
        id: version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          deb_version="$(dpkg-parsechangelog -S Version)"
          if [ "$tag" != "$deb_version" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} must match debian/changelog version ${deb_version}"
            exit 1
          fi
          echo "deb_version=${deb_version}" >> "$GITHUB_OUTPUT"

      - name: Build package
        run: ./deploy/build-deb.sh

      - name: Prepare release notes
        id: notes
        run: |
          {
            echo 'body<<EOF'
            dpkg-parsechangelog -c1 -S Changes | tail -n +4
            echo
            echo 'Install from the hardenedpenguin apt repo: `sudo apt install sm-elite`'
            echo EOF
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          name: SM-Elite ${{ steps.version.outputs.deb_version }}
          body: ${{ steps.notes.outputs.body }}
          files: dist/sm-elite_${{ steps.version.outputs.deb_version }}_all.deb
          generate_release_notes: false

  publish-apt-repo:
    needs: release
    uses: hardenedpenguin/hardenedpenguin-apt/.github/workflows/dispatch-apt-publish.yml@main
    secrets:
      APT_REPO_DISPATCH_TOKEN: ${{ secrets.APT_REPO_DISPATCH_TOKEN }}
