name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: bookworm
            image: debian:bookworm
            deb_tag: deb12
          - suite: trixie
            image: debian:trixie
            deb_tag: deb13
    container: ${{ matrix.image }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install build dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential debhelper dpkg-dev python3 python3-aiohttp python3-yaml

      - name: Verify tag matches debian/changelog
        id: version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          deb_version="$(dpkg-parsechangelog -S Version)"
          if [ "$tag" != "$deb_version" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} must match debian/changelog version ${deb_version}"
            exit 1
          fi
          echo "deb_version=${deb_version}" >> "$GITHUB_OUTPUT"
          echo "pkg_version=${deb_version}-1.${{ matrix.deb_tag }}" >> "$GITHUB_OUTPUT"

      - name: Run tests on ${{ matrix.suite }}
        run: PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s tests

      - name: Build ${{ matrix.suite }} package
        run: ./deploy/build-deb.sh ${{ matrix.suite }}

      - name: Upload ${{ matrix.suite }} package
        uses: actions/upload-artifact@v4
        with:
          name: sm-elite-${{ matrix.suite }}
          path: dist/sm-elite_${{ steps.version.outputs.pkg_version }}_all.deb
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    container: debian:trixie
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install changelog tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends dpkg-dev

      - name: Read upstream version
        id: version
        run: |
          deb_version="$(dpkg-parsechangelog -S Version)"
          echo "deb_version=${deb_version}" >> "$GITHUB_OUTPUT"

      - name: Download suite packages
        uses: actions/download-artifact@v4
        with:
          pattern: sm-elite-*
          merge-multiple: true
          path: dist

      - name: Prepare release notes
        id: notes
        run: |
          {
            echo 'body<<EOF'
            dpkg-parsechangelog -c1 -S Changes | tail -n +4
            echo
            echo 'Install from the hardenedpenguin apt repo: `sudo apt install sm-elite`'
            echo
            echo 'Manual install from this release:'
            echo '- Debian 12 (bookworm): `sudo apt install ./sm-elite_*-1.deb12_all.deb`'
            echo '- Debian 13 (trixie): `sudo apt install ./sm-elite_*-1.deb13_all.deb`'
            echo EOF
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          name: SM-Elite ${{ steps.version.outputs.deb_version }}
          body: ${{ steps.notes.outputs.body }}
          files: |
            dist/sm-elite_${{ steps.version.outputs.deb_version }}-1.deb12_all.deb
            dist/sm-elite_${{ steps.version.outputs.deb_version }}-1.deb13_all.deb
          generate_release_notes: false

  publish-apt-repo:
    needs: release
    uses: hardenedpenguin/hardenedpenguin-apt/.github/workflows/dispatch-apt-publish.yml@main
    secrets:
      APT_REPO_DISPATCH_TOKEN: ${{ secrets.APT_REPO_DISPATCH_TOKEN }}
